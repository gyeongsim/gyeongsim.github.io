<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gyeongsim Kim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #FAF9F6;
    --ink: #1B1B18;
    --ink-soft: #6B6960;
    --accent: #3D5A73;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  body{
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  main{
    max-width: 520px;
    text-align: center;
  }

  h1{
    font-family: 'Source Serif 4', serif;
    font-weight: 600;
    font-size: clamp(32px, 6vw, 44px);
    margin-bottom: 14px;
  }

  p{
    font-size: 18px;
    color: var(--ink-soft);
    line-height: 1.6;
  }

  .accent{
    color: var(--accent);
    font-weight: 500;
  }
</style>
</head>
<body>

<main>
  <h1>Gyeongsim Kim</h1>
  <p>I'm a <span class="accent">PhD Candidate</span> at <span class="accent">Georgia Tech</span>.</p>
</main>

</body>
</html>
